<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillTrack - SLB Portaal | Noorderpoort</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f4f4f5; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-zinc-900">

  <!-- Bovenbalk -->
  <header class="bg-black text-white py-4 px-6 border-b-4 border-[#FFCC00] flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-white px-3 py-1 rounded font-bold text-black tracking-tight text-lg">
        Noorderp<span class="text-[#FFCC00]">oo</span>rt
      </div>
      <span class="font-semibold text-lg tracking-wide">SkillTrack</span>
      <span class="bg-[#FFCC00] text-black text-xs font-bold px-2.5 py-1 rounded uppercase">SLB Portaal</span>
    </div>

    <div class="flex items-center gap-3">
      <span id="docentNaamLabel" class="text-sm text-zinc-300 hidden sm:inline"></span>
      <a href="index.html?profiel=1" class="text-sm bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-2 rounded font-medium transition">
        Mijn profiel
      </a>
      <button onclick="uitloggen()" class="text-sm bg-zinc-800 hover:bg-zinc-700 text-white px-3 py-2 rounded font-medium transition">
        Uitloggen
      </button>
    </div>
  </header>

  <!-- Hoofdinhoud -->
  <main class="flex-grow max-w-6xl w-full mx-auto p-6 space-y-6">

    <!-- Bovenste samenvatting en filters -->
    <div class="bg-white p-6 rounded-lg shadow-sm border border-zinc-200 space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold">Voortgang SLB-studenten</h1>
          <p class="text-sm text-zinc-600">Bekijk de actuele status en notities van je studenten.</p>
        </div>
        <button onclick="laadGegevens()" class="bg-black hover:bg-zinc-800 text-[#FFCC00] text-sm font-bold px-4 py-2 rounded transition">
          Ververs overzicht
        </button>
      </div>

      <!-- Filterbalk -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 border-t border-zinc-100">
        <div>
          <label class="block text-xs font-bold uppercase text-zinc-500 mb-1">SLB'er</label>
          <select id="filterSlb" onchange="filterStudenten()" class="w-full px-3 py-2 border border-zinc-300 rounded text-sm bg-white focus:outline-none focus:border-black">
            <option value="ALLE">Alle SLB'ers (Team BOS7)</option>
            <option value="René de Jonge">René de Jonge</option>
            <option value="Jos Zuidema">Jos Zuidema</option>
            <option value="Overig team BOS7">Overig team BOS7</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-zinc-500 mb-1">Opleiding</label>
          <select id="filterOpleiding" onchange="filterStudenten()" class="w-full px-3 py-2 border border-zinc-300 rounded text-sm bg-white focus:outline-none focus:border-black">
            <option value="ALLE">Alle opleidingen</option>
            <option value="vakspecialist">Vakspecialist Ondernemer (25997)</option>
            <option value="handel">Ondernemer Handel en Dienstverlening (27121)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-zinc-500 mb-1">Zoek op naam</label>
          <input type="text" id="filterZoek" oninput="filterStudenten()" placeholder="Typ naam van student..." class="w-full px-3 py-2 border border-zinc-300 rounded text-sm focus:outline-none focus:border-black">
        </div>
      </div>
    </div>

    <!-- Studententabel -->
    <div class="bg-white rounded-lg shadow-sm border border-zinc-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-zinc-900 text-white text-xs uppercase">
              <th class="py-3.5 px-4 font-semibold">Student</th>
              <th class="py-3.5 px-4 font-semibold">Opleiding</th>
              <th class="py-3.5 px-4 font-semibold">SLB'er</th>
              <th class="py-3.5 px-4 font-semibold">Voortgang</th>
              <th class="py-3.5 px-4 font-semibold">Laatste update</th>
              <th class="py-3.5 px-4 font-semibold text-right">Actie</th>
            </tr>
          </thead>
          <tbody id="studentenTabelBody" class="divide-y divide-zinc-200 text-sm">
            <tr>
              <td colspan="6" class="py-8 text-center text-zinc-500">Gegevens ophalen uit database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Zijpaneel (Modal) voor details van één student -->
  <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end">
    <div class="bg-white w-full max-w-xl h-full overflow-y-auto p-6 shadow-2xl flex flex-col justify-between">
      <div class="space-y-6">
        <div class="flex justify-between items-start border-b border-zinc-200 pb-4">
          <div>
            <span id="modalOpleiding" class="text-xs font-bold uppercase bg-[#FFCC00] text-black px-2 py-0.5 rounded"></span>
            <h2 id="modalStudentNaam" class="text-2xl font-bold mt-2"></h2>
            <p id="modalSlbNaam" class="text-sm text-zinc-500"></p>
          </div>
          <button onclick="sluitModal()" class="text-zinc-400 hover:text-black text-2xl font-bold leading-none">&times;</button>
        </div>

        <div>
          <h3 class="font-bold text-base mb-3">Afgevinkte onderdelen en notities</h3>
          <div id="modalOnderdelenLijst" class="space-y-3"></div>
        </div>
      </div>

      <div class="pt-6 border-t border-zinc-200 mt-6 flex justify-end">
        <button onclick="sluitModal()" class="bg-black text-white px-5 py-2 rounded text-sm font-bold hover:bg-zinc-800">
          Sluiten
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zusxpspppahpnnwehyly.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qt8y504lX4oB0VBoRmX9AQ_1bBgE9L2';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Totaal aantal onderdelen in de route voor berekening van het percentage
    const TOTAAL_ONDERDELEN = 38;

    let alleStudenten = [];
    let alleVoortgang = [];

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      // Controleer of de ingelogde gebruiker echt een docent is
      const { data: mijnProfiel } = await supabaseClient
        .from('profielen')
        .select('*')
        .eq('id', session.user.id)
        .single();

      if (!mijnProfiel || mijnProfiel.rol !== 'docent') {
        window.location.href = 'route.html';
        return;
      }

      document.getElementById('docentNaamLabel').textContent = `Ingelogd als ${mijnProfiel.naam}`;
      
      // Zet het filter standaard op de ingelogde docent als die in de lijst staat
      const slbSelect = document.getElementById('filterSlb');
      if ([...slbSelect.options].some(o => o.value === mijnProfiel.naam)) {
        slbSelect.value = mijnProfiel.naam;
      }

      laadGegevens();
    });

    async function laadGegevens() {
      const { data: studenten, error: errStud } = await supabaseClient
        .from('profielen')
        .select('*')
        .eq('rol', 'student')
        .order('naam', { ascending: true });

      const { data: voortgang, error: errVoort } = await supabaseClient
        .from('voortgang')
        .select('*');

      if (errStud || errVoort) {
        document.getElementById('studentenTabelBody').innerHTML = `
          <tr><td colspan="6" class="py-8 text-center text-red-600">Fout bij laden van gegevens.</td></tr>`;
        return;
      }

      alleStudenten = studenten || [];
      alleVoortgang = voortgang || [];
      filterStudenten();
    }

    function filterStudenten() {
      const gekozenSlb = document.getElementById('filterSlb').value;
      const gekozenOpleiding = document.getElementById('filterOpleiding').value;
      const zoekTekst = document.getElementById('filterZoek').value.toLowerCase();

      const gefilterd = alleStudenten.filter(student => {
        const matchSlb = gekozenSlb === 'ALLE' || student.slb_docent === gekozenSlb;
        const matchOpl = gekozenOpleiding === 'ALLE' || student.opleiding === gekozenOpleiding;
        const matchNaam = student.naam.toLowerCase().includes(zoekTekst);
        return matchSlb && matchOpl && matchNaam;
      });

      tekenTabel(gefilterd);
    }

    function tekenTabel(studentenLijst) {
      const tbody = document.getElementById('studentenTabelBody');

      if (studentenLijst.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="6" class="py-8 text-center text-zinc-500">Geen studenten gevonden voor deze selectie.</td></tr>`;
        return;
      }

      tbody.innerHTML = studentenLijst.map(student => {
        const studentItems = alleVoortgang.filter(v => v.student_id === student.id);
        const afgerondAantal = studentItems.filter(v => v.afgerond).length;
        const percentage = Math.min(100, Math.round((afgerondAantal / TOTAAL_ONDERDELEN) * 100));

        // Bepaal laatste update datum
        let laatsteDatum = 'Nog geen activiteit';
        if (studentItems.length > 0) {
          const gesorteerd = [...studentItems].sort((a, b) => new Date(b.bijgewerkt_op) - new Date(a.bijgewerkt_op));
          laatsteDatum = new Date(gesorteerd[0].bijgewerkt_op).toLocaleDateString('nl-NL', {
            day: '2-digit', month: '2-digit', year: 'numeric'
          });
        }

        const opleidingLabel = student.opleiding === 'vakspecialist' ? 'Vakspecialist (25997)' : 'Ondernemer Handel (27121)';

        return `
          <tr class="hover:bg-zinc-50 transition">
            <td class="py-4 px-4 font-bold text-zinc-900">${student.naam}</td>
            <td class="py-4 px-4 text-zinc-600">${opleidingLabel}</td>
            <td class="py-4 px-4 text-zinc-600">${student.slb_docent || '-'}</td>
            <td class="py-4 px-4">
              <div class="flex items-center gap-3">
                <div class="w-28 bg-zinc-200 rounded-full h-2.5 overflow-hidden">
                  <div class="bg-[#FFCC00] h-2.5 rounded-full" style="width: ${percentage}%"></div>
                </div>
                <span class="text-xs font-bold">${afgerondAantal} items (${percentage}%)</span>
              </div>
            </td>
            <td class="py-4 px-4 text-zinc-500 text-xs">${laatsteDatum}</td>
            <td class="py-4 px-4 text-right">
              <button onclick="openStudentDetails('${student.id}')" class="bg-black hover:bg-zinc-800 text-white text-xs font-bold px-3 py-1.5 rounded transition">
                Details bekijken
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function openStudentDetails(studentId) {
      const student = alleStudenten.find(s => s.id === studentId);
      const items = alleVoortgang.filter(v => v.student_id === studentId);

      document.getElementById('modalStudentNaam').textContent = student.naam;
      document.getElementById('modalOpleiding').textContent = student.opleiding === 'vakspecialist' ? 'Vakspecialist Ondernemer' : 'Ondernemer Handel';
      document.getElementById('modalSlbNaam').textContent = `SLB'er: ${student.slb_docent || 'Niet ingesteld'}`;

      const lijstEl = document.getElementById('modalOnderdelenLijst');
      if (items.length === 0) {
        lijstEl.innerHTML = `<p class="text-sm text-zinc-500">Deze student heeft nog geen onderdelen afgevinkt of notities opgeslagen.</p>`;
      } else {
        lijstEl.innerHTML = items.map(item => `
          <div class="p-3 rounded border ${item.afgerond ? 'border-green-200 bg-green-50' : 'border-zinc-200 bg-zinc-50'}">
            <div class="flex justify-between items-center">
              <span class="font-bold text-sm">${item.onderdeel_id}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded ${item.afgerond ? 'bg-green-600 text-white' : 'bg-zinc-300 text-zinc-700'}">
                ${item.afgerond ? 'Afgerond' : 'Bezig'}
              </span>
            </div>
            ${item.notitie ? `<p class="text-xs text-zinc-700 mt-2 bg-white p-2 rounded border border-zinc-200">Notitie: ${item.notitie}</p>` : ''}
          </div>
        `).join('');
      }

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function sluitModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    async function uitloggen() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
